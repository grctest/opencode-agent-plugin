name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Audit 19 Phase 4 / RH5 — syntax gate over ALL sources, not a hand-list
      - name: Syntax check (src + scripts)
        run: node scripts/check.mjs

      # Unit suite (audit 19 Phase 1) — pure modules, zero network
      - name: Unit tests
        run: npm test

      # Bundle must succeed and produce a non-empty, parseable artifact
      - name: Bundle
        run: npm run bundle

      - name: Verify bundle artifact
        run: |
          test -s dist/loom.js || { echo "dist/loom.js missing or empty"; exit 1; }
          node --check dist/loom.js
